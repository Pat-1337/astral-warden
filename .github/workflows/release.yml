name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release --locked
      - run: cargo build --release --locked --features portable --target-dir target-portable
      - shell: pwsh
        run: |
          $base = "gpu-warden-${{ github.ref_name }}-windows-x86_64"
          Copy-Item target/release/gpu-warden.exe "$base-setup.exe"

          New-Item -ItemType Directory "$base-portable" | Out-Null
          Copy-Item target-portable/release/gpu-warden.exe, README.md, LICENSE "$base-portable"
          Compress-Archive "$base-portable" "$base-portable.zip"
      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: |
            *.zip
            *.exe

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: mlugg/setup-zig@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild
      - run: cargo zigbuild --release --locked --target x86_64-unknown-linux-gnu.2.17
      - run: |
          bin=target/x86_64-unknown-linux-gnu/release/gpu-warden
          for flavor in systemd openrc runit; do
            name="gpu-warden-${GITHUB_REF_NAME}-linux-x86_64-${flavor}"
            mkdir -p "$name/init"
            cp "$bin" README.md LICENSE "$name/"
            cp init/modules-load.conf init/udev.rules "$name/init/"
            case $flavor in
              systemd) cp init/gpu-warden.service "$name/init/" ;;
              openrc)  cp init/gpu-warden.openrc "$name/init/" ;;
              runit)   cp init/gpu-warden.runit "$name/init/" ;;
            esac
            tar czf "$name.tar.gz" "$name"
          done
      - uses: actions/upload-artifact@v7
        with:
          name: linux
          path: "*.tar.gz"

  omarchy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: mlugg/setup-zig@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild
      - run: cargo zigbuild --release --locked --features omarchy --target x86_64-unknown-linux-gnu.2.17
      - run: |
          name="gpu-warden-${GITHUB_REF_NAME}-linux-x86_64-omarchy"
          mkdir -p "$name/init" "$name/omarchy"
          cp target/x86_64-unknown-linux-gnu/release/gpu-warden README.md LICENSE "$name/"
          cp init/modules-load.conf init/udev.rules init/gpu-warden.service "$name/init/"
          cp omarchy/manifest.json omarchy/BarWidget.qml "$name/omarchy/"
          tar czf "$name.tar.gz" "$name"
      - uses: actions/upload-artifact@v7
        with:
          name: omarchy
          path: "*.tar.gz"

  publish:
    needs: [windows, linux, omarchy]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: src
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true
      - run: sha256sum *.exe *.zip *.tar.gz > SHA256SUMS
      - run: |
          version="${GITHUB_REF_NAME#v}"
          hash=$(sha256sum gpu-warden-*-windows-x86_64-portable.zip | cut -d' ' -f1)
          sed -e "s/@VERSION@/$version/g" -e "s/@HASH@/$hash/" src/packaging/scoop/gpu-warden.json > gpu-warden.json
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            *.exe
            *.zip
            *.tar.gz
            SHA256SUMS
            gpu-warden.json
          generate_release_notes: true

  aur:
    needs: publish
    runs-on: ubuntu-latest
    env:
      AUR_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
    steps:
      - if: env.AUR_KEY != ''
        uses: actions/checkout@v7
      - if: env.AUR_KEY != ''
        run: sed -i "s/^pkgver=.*/pkgver=${GITHUB_REF_NAME#v}/; s/^pkgrel=.*/pkgrel=1/" packaging/aur/PKGBUILD
      - if: env.AUR_KEY != ''
        uses: KSXGitHub/github-actions-deploy-aur@v4.2.0
        with:
          pkgname: gpu-warden-bin
          pkgbuild: packaging/aur/PKGBUILD
          assets: packaging/aur/gpu-warden.install
          updpkgsums: true
          commit_username: Pat-1337
          commit_email: ${{ secrets.AUR_EMAIL }}
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          commit_message: update to ${{ github.ref_name }}
