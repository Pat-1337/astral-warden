name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release --locked
      - shell: pwsh
        run: |
          $name = "astral-warden-${{ github.ref_name }}-windows-x86_64"
          New-Item -ItemType Directory $name | Out-Null
          Copy-Item target/release/astral-warden.exe, README.md, LICENSE $name
          Compress-Archive $name "$name.zip"
      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: "*.zip"

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: mlugg/setup-zig@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild
      - run: cargo zigbuild --release --locked --target x86_64-unknown-linux-gnu.2.17
      - run: |
          bin=target/x86_64-unknown-linux-gnu/release/astral-warden
          for flavor in systemd openrc runit; do
            name="astral-warden-${GITHUB_REF_NAME}-linux-x86_64-${flavor}"
            mkdir -p "$name/init"
            cp "$bin" README.md LICENSE "$name/"
            cp init/modules-load.conf "$name/init/"
            case $flavor in
              systemd) cp init/astral-warden.service "$name/init/" ;;
              openrc)  cp init/astral-warden.openrc "$name/init/" ;;
              runit)   cp init/astral-warden.runit "$name/init/" ;;
            esac
            tar czf "$name.tar.gz" "$name"
          done
      - uses: actions/upload-artifact@v7
        with:
          name: linux
          path: "*.tar.gz"

  omarchy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: mlugg/setup-zig@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild
      - run: cargo zigbuild --release --locked --features omarchy --target x86_64-unknown-linux-gnu.2.17
      - run: |
          name="astral-warden-${GITHUB_REF_NAME}-linux-x86_64-omarchy"
          mkdir -p "$name/init" "$name/omarchy"
          cp target/x86_64-unknown-linux-gnu/release/astral-warden README.md LICENSE "$name/"
          cp init/modules-load.conf init/astral-warden.service "$name/init/"
          cp omarchy/manifest.json omarchy/BarWidget.qml "$name/omarchy/"
          tar czf "$name.tar.gz" "$name"
      - uses: actions/upload-artifact@v7
        with:
          name: omarchy
          path: "*.tar.gz"

  publish:
    needs: [windows, linux, omarchy]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: src
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true
      - run: sha256sum *.zip *.tar.gz > SHA256SUMS
      - run: |
          version="${GITHUB_REF_NAME#v}"
          hash=$(sha256sum astral-warden-*-windows-x86_64.zip | cut -d' ' -f1)
          sed -e "s/@VERSION@/$version/g" -e "s/@HASH@/$hash/" src/packaging/scoop/astral-warden.json > astral-warden.json
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            *.zip
            *.tar.gz
            SHA256SUMS
            astral-warden.json
          generate_release_notes: true

  aur:
    needs: publish
    runs-on: ubuntu-latest
    env:
      AUR_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
    steps:
      - if: env.AUR_KEY != ''
        uses: actions/checkout@v7
      - if: env.AUR_KEY != ''
        run: sed -i "s/^pkgver=.*/pkgver=${GITHUB_REF_NAME#v}/; s/^pkgrel=.*/pkgrel=1/" packaging/aur/PKGBUILD
      - if: env.AUR_KEY != ''
        uses: KSXGitHub/github-actions-deploy-aur@v4.2.0
        with:
          pkgname: astral-warden-bin
          pkgbuild: packaging/aur/PKGBUILD
          assets: packaging/aur/astral-warden.install
          updpkgsums: true
          commit_username: Pat-1337
          commit_email: ${{ secrets.AUR_EMAIL }}
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          commit_message: update to ${{ github.ref_name }}
